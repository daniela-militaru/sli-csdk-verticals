        <h2>Why this exemptive order matters now for public companies</h2><p>The SEC’s five-year Innovation Exemption lets regulated venues offer tokenized versions of listed stock, with a notice and objection process for issuers.</p><h2>Notification and objection process</h2><p>Venues must give written notice, publish a plain-English public notice, and wait 30 days. A written objection stops listing.</p><h2>Selected practical considerations</h2><p>Companies should confirm the address on Exchange Act filings is monitored and decide who owns an objection.</p><h2>Action items to consider</h2><p>Map the notice path, brief the board, and prepare a short objection playbook before a venue writes.</p>
