        <h2>Background</h2><p>Australia’s mandatory sustainability reporting regime commenced in 2025. ASIC reviewed a sample of Group 1 reports for the year ending 31 December 2025.</p><h2>Headline findings</h2><p>Preparation, lodgement, and audit requirements were generally met. Disclosure quality is the gap ASIC expects to close.</p><h2>ASIC's eight key action items</h2><p>Treat the eight action items as a checklist when the next Group 1 reports are finalised.</p><h2>Key takeaways and next steps</h2><p>Entities with a 30 June 2026 year end are the next cohort. Boards should test governance, scenario analysis, and scope 3 readiness now.</p>
