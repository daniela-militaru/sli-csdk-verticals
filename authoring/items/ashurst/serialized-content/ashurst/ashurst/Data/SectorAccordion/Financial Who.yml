    - ID: "fdfd2bcd-838f-4be7-a65e-106d62fbc542"
      Hint: Item2Body
      Value: |
        <p>We have been shaping the blockchain and digital asset industry since 2010, when the industry players could all fit in one room.</p><p>Our market-leading digital assets and blockchain practice advises across the full spectrum of legal complexity. We are go-to advisers for regulatory classification, licensing strategy, product structuring, and custody frameworks. When stakes are high, we advocate for our clients in regulatory enforcement matters and disputes. We serve established financial institutions entering the digital asset market and native digital asset businesses scaling into regulated environments.</p>
    - ID: "ace72ef3-03bc-49be-a35b-ca07b16f93bf"
      Hint: Item3Title
      Value: |
        Investment and asset management
    - ID: "dbf562af-6148-44d3-a6a1-2422afff5a8b"
      Hint: Item3Teaser
      Value: |
        
    - ID: "bc6fa71b-3b58-4015-9ac0-5ae0f7ceb672"
      Hint: Item3Body
      Value: |
        <p>We represent an array of clients, from investment funds to financial institutions and the corporate treasurers of public corporations, in the negotiation of intricate trading documentation with dealer counterparties. We also support clients from origination through execution, including post-trade compliance and dispute resolution. Our team includes lawyers who focus on tax, ERISA, and securities enforcement, offering experienced advice about regulatory and enforcement matters. Our experience covers equity capital markets, debt capital markets, structured finance, derivatives, leveraged finance, and securitization.</p><p>We advise on fund formation and structuring, M&A and portfolio transactions, and cross-border investment strategies across private equity, private credit, infrastructure, and real assets.</p>
    - ID: "2bbc5b10-f6e5-47a2-b154-ad816816c759"
      Hint: Item4Title
      Value: |
        Fintech, payments, and infrastructure
    - ID: "e9432518-8eb2-4df9-ab9b-e7effb7783e1"
      Hint: Item4Teaser
      Value: |
        
    - ID: "3ee424e4-88c8-4f1e-ba74-bf71dd6a0082"
      Hint: Item4Body
      Value: |
        <p>Our integrated team combines experience across financial regulation, technology and commercial transactions, IP, cybersecurity, data privacy, and capital markets. This breadth enables us to provide holistic advice that helps clients innovate in a way that is compliant, sustainable, and operationally effective. We do not simply respond to regulatory change; we anticipate it, engaging actively with regulators, policymakers, and industry bodies to provide the forward-looking insight clients need to stay ahead.</p><p>We advise fintechs focusing on payments and infrastructure, assisting with licensing and regulatory authorization, product structuring, and bank and scheme partnerships, as well as consumer protection compliance and cross-border expansion. Our cross-disciplinary team advises clients at the intersection of payment systems and market infrastructure, bringing practical insight into the operational design, governance frameworks, contractual structures, and technology systems that support these complex ecosystems.</p>
