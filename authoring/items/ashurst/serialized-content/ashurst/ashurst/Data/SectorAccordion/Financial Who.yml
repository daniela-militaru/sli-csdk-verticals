    - ID: "059be3fc-ec8f-4584-8bd6-c9b8a1058779"
      Hint: Item1Body
      Value: |
        <p>Our industry-leading practice serves clients across the full range of transactional, regulatory, and strategic issues shaping the sector. We act on complex multijurisdictional financings, capital markets mandates, and M&A transactions while advising on prudential and conduct requirements, supervisory engagement, recovery and resolution planning, enforcement defense, and the increasingly digital regulatory environment.</p><p>We work with banks as they structure, capitalize, and operate across varied jurisdictions, transform technology infrastructure, develop digital asset strategies, and respond to operational resilience requirements. Our practice spans the world’s major financial centers, including London, New York, Hong Kong, Singapore, Dubai, Frankfurt, Paris, Tokyo, and Sydney. We act for lenders and borrowers, issuers and investors, regulated institutions, counterparties, nonbank lenders, and specialty finance clients. Our team supports licensing, market entry, product structuring, funding arrangements, and ongoing compliance across the United States, the United Kingdom, Europe, Asia-Pacific, and the Middle East, combining legal advice, risk consulting, and advanced legal technology.</p>
    - ID: "58c4f3a2-2d46-4597-8332-b50786010a05"
      Hint: Item2Title
      Value: |
        Blockchain and digital assets
    - ID: "e38e1a79-4981-4863-aeca-d7b5a4fd32b3"
      Hint: Item2Teaser
