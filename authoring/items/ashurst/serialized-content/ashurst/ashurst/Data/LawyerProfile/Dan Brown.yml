        <ul><li><strong>Ark Energy:</strong> Advised on its investment in a 30% interest in the 923.4MW MacIntyre Wind Farm in Queensland, one of the largest onshore wind farms in the southern hemisphere.</li><li><strong>Ark Energy:</strong> Advising on the procurement phase of the Boomer Green Energy Hub, a wind farm and battery energy storage system supplying approximately 1,150MW to the national grid.</li><li><strong>AMPYR Australia:</strong> Advising on the development of the 300MW/600MWh Bulabul Battery Project in New South Wales.</li><li><strong>CS Energy:</strong> Advised on its acquisition of a 50% interest in the Boulder Creek Wind Farm, including the joint venture arrangements for development, construction and operation.</li><li><strong>Cubico Sustainable Investments:</strong> Advised on the development, operations and joint venture arrangements for the circa A$700 million Wambo Wind Farm Stage 1 and Stage 2.</li><li><strong>EnergyAustralia:</strong> Advised on its joint venture with EDF power solutions Australia to co-develop the Lake Lyell Pumped Hydro Energy Storage project in Lithgow.</li><li><strong>Shell:</strong> Advised on its joint development arrangements for the 500MW/1000MWh Wallerawang 9 BESS in New South Wales.</li><li><strong>Acciona – Brisbane Metro:</strong> Advised on a suite of bespoke construction and procurement contracts for the $900 million Brisbane Metro project.</li></ul>
