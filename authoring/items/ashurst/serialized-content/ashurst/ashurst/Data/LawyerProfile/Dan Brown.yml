    - ID: "40693392-6b66-4899-8615-aab84f36c28c"
      Hint: Bio
      Value: |
        <p>Dan Brown is Global Leader, Energy &amp; Infrastructure Industry at Ashurst Perkins Coie.</p><p>He advises sponsors, developers, investors and lenders on major energy, resources and infrastructure projects across the Asia-Pacific region.</p><p>Dan’s work sits at the center of the systems that power modern economies. He advises on renewable energy, conventional power, transmission, major infrastructure, digital infrastructure, data centers and emerging energy transition technologies.</p><p>Clients value Dan for his clear judgement, deep industry knowledge and commercial approach. He helps clients structure projects, manage risk, navigate market and regulatory change, and make confident decisions on complex projects.</p><p>As Global Leader of Ashurst Perkins Coie’s Energy &amp; Infrastructure Industry, Dan helps shape the firm’s global sector strategy. He connects teams across markets and ensures Ashurst Perkins Coie brings uncommon insight and experience to clients facing major investment, policy and transition challenges.</p><p>Dan’s recognition includes The Australian’s Green List of Australia’s Top 100 Energy Players, Legal 500’s 2026 Green Ambassador recognition, and Best Lawyers recognition for Energy, Construction and Infrastructure.</p>
