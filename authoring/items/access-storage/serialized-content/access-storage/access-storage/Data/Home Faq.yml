    - ID: "49ee66b5-86c3-4cd0-a972-f5ce73613e7b"
      Hint: Item1Question
      Value: |
        How much does self storage cost?
    - ID: "dc544bea-ae31-4328-a796-6a13709aa7ef"
      Hint: Item1Answer
      Value: |
        <p>Prices vary by location and unit size. Use our quote tool to get live pricing at your nearest store. New customers get their first 8 weeks half price.</p>
    - ID: "4a9a21aa-3b30-4c24-8d4f-6e4ec2bfa5fe"
      Hint: Item2Question
      Value: |
        Do I need to sign a long-term contract?
    - ID: "22acc2bd-8ebe-443d-a705-b20915cd6b40"
      Hint: Item2Answer
      Value: |
        <p>No. All units are on flexible monthly rolling contracts. Personal customers can move out with as little as seven days’ notice.</p>
    - ID: "eb1e1fa1-9c24-43d6-a8cf-516bf12d46d9"
      Hint: Item3Question
      Value: |
        Do I need to pay a deposit?
    - ID: "690189a6-f72b-4b4c-8b90-dfc37fd7b405"
      Hint: Item3Answer
      Value: |
        <p>No deposit required. You can reserve your unit online completely free of charge.</p>
    - ID: "f46b7c00-3400-407d-a0ec-cfd2c781e025"
      Hint: Item4Question
      Value: |
        What sizes are available?
    - ID: "75d2bfe8-7d7f-41ad-b6bd-b98c8a3995ec"
      Hint: Item4Answer
      Value: |
        <p>From small lockers to large room-sized spaces. Our team at your nearest store will help you find the right fit.</p>
