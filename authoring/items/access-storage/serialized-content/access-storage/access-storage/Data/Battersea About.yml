    - ID: "becf633c-855a-4559-973b-cfa82169b24c"
      Hint: Body
      Value: |
        <p>The store is outside the Congestion Charge zone and is used for house moves, decluttering, office space, and parking commercial vehicles. You can change unit size when you need to, and packing materials are available in store.</p><p>From Clapham Junction the store is about three minutes by car: leave on the north side, turn left onto Grant Road, right onto Plough Road, and left onto York Road. Parking is on Mendip Road. On foot it is about eleven minutes through York Gardens.</p><p>Kris manages the Battersea store and looks after maintenance and customer service. The store is a short trip from theatres, restaurants, and Kensington High Street.</p>
